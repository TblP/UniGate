name: Build installers

# Собирает UniGate под Windows, macOS и Android.
# - workflow_dispatch — ручной запуск (артефакты качаются со страницы run).
# - push тега v* — то же самое + отдельным джобом публикует GitHub Release
#   со всеми инсталлерами (после успешного завершения всех сборок).
#
# Сетевые бинарники (sing-box, geoip-ru, wintun, amneziawg) в git не хранятся
# (см. .gitignore) — их тянут scripts/fetch-singbox.{ps1,sh} перед сборкой.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows
            fetch: pwsh scripts/fetch-singbox.ps1
          - os: macos-latest # macos-latest = Apple Silicon (arm64)
            label: macos-arm64
            fetch: bash scripts/fetch-singbox.sh

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      # awg-shim (userspace AmneziaWG → SOCKS5) собирается из awg-shim/ на Go
      # внутри platform fetch-скриптов для Windows и macOS.
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: awg-shim/go.sum

      - name: Fetch sing-box and platform binaries
        run: ${{ matrix.fetch }}

      - name: Build AmneziaWG engine for macOS
        if: runner.os == 'macOS'
        run: bash scripts/fetch-awg-macos.sh

      - name: Build application
        run: npm run tauri build
        env:
          # Windows updater artifacts are signed independently from the
          # optional Authenticode publisher signature.
          TAURI_SIGNING_PRIVATE_KEY: ${{ runner.os == 'Windows' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ runner.os == 'Windows' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}

      # Инсталлеры Windows: MSI (WiX) + NSIS-setup.exe
      - name: Upload Windows installers
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: unigate-${{ matrix.label }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig

      # Инсталлер macOS: .dmg (неподписанный — Gatekeeper потребует
      # «ПКМ → Открыть» при первом запуске; подпись/нотаризация — отдельно)
      - name: Upload macOS installer
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: unigate-${{ matrix.label }}
          if-no-files-found: error
          path: src-tauri/target/release/bundle/dmg/*.dmg

  build-android:
    name: android-arm64
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      # Android разрешает обновление только APK с тем же сертификатом. Cache
      # изолирован по git-ref и может быть удалён, поэтому ключ держим в Secret;
      # при его отсутствии сборка обязана упасть, а не выпустить несовместимый APK.
      - name: Restore Android self-signed key
        shell: pwsh
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:ANDROID_DEBUG_KEYSTORE_BASE64)) {
            throw "ANDROID_DEBUG_KEYSTORE_BASE64 secret is not configured"
          }
          $androidHome = Join-Path $HOME ".android"
          New-Item -ItemType Directory -Force -Path $androidHome | Out-Null
          $keyPath = Join-Path $androidHome "debug.keystore"
          $keyBytes = [Convert]::FromBase64String($env:ANDROID_DEBUG_KEYSTORE_BASE64)
          [IO.File]::WriteAllBytes($keyPath, $keyBytes)

      - name: Setup Android toolchain
        shell: pwsh
        run: scripts/setup-android.ps1

      - name: Fetch Android routing assets
        shell: pwsh
        run: scripts/fetch-android-assets.ps1

      - name: Build Android ARM64 APK
        shell: pwsh
        run: scripts/build-android.ps1

      - name: Verify Android APK
        shell: pwsh
        run: |
          $apk = Get-ChildItem -LiteralPath dist/android -Filter "UniGate_*_android_arm64.apk" |
            Select-Object -First 1
          if (-not $apk) { throw "Android APK was not produced" }
          $apksigner = Join-Path $env:LOCALAPPDATA "unigate-android-tools/android-sdk/build-tools/36.0.0/apksigner.bat"
          $signatureReport = (& $apksigner verify --verbose --print-certs $apk.FullName 2>&1 | Out-String)
          $verifyExitCode = $LASTEXITCODE
          Write-Host $signatureReport
          if ($verifyExitCode -ne 0) { throw "Android APK signature verification failed" }
          $expectedCertificate = "9dc091d6e53b4f3e324d964955f9027615d0961cb61c74d5cb975741f36b0099"
          if ($signatureReport -notmatch "Signer #1 certificate SHA-256 digest:\s*$expectedCertificate") {
            throw "Android APK was signed by an unexpected certificate"
          }

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: unigate-android-arm64
          if-no-files-found: error
          path: dist/android/UniGate_*_android_arm64.apk

  # Публикуем Release только на теге v* и только когда все сборки удачны
  # (needs: build + build-android). Один джоб собирает артефакты в единый релиз —
  # без гонки параллельных загрузок.
  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write # создать/обновить Release и залить в него файлы
    steps:
      - name: Checkout release notes
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts # каждая сборка попадёт в свой подкаталог

      - name: Create Windows updater manifest
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          installer="$(find artifacts -type f -name '*-setup.exe' -print -quit)"
          signature_file="${installer}.sig"
          test -n "$installer"
          test -f "$signature_file"
          asset_name="$(basename "$installer")"
          asset_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${asset_name}"
          manifest="$(dirname "$installer")/latest.json"
          jq -n \
            --arg version "$version" \
            --rawfile notes RELEASE_NOTES.md \
            --arg url "$asset_url" \
            --rawfile signature "$signature_file" \
            '{version: $version, notes: $notes, platforms: {"windows-x86_64": {url: $url, signature: $signature}}}' \
            > "$manifest"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Windows, macOS и Android из отдельных artifact-подкаталогов.
          files: artifacts/**/*
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          fail_on_unmatched_files: true
